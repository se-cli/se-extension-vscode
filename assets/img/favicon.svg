<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="se-extension-vscode">
  <!-- Favicon: green rounded square with white >_ terminal symbol + VS Code blue brackets -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#22C55E"/>
  <!-- VS Code blue angle bracket left < -->
  <path d="M22 22 L16 32 L22 42" fill="none" stroke="#007ACC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Prompt caret > -->
  <path d="M28 24 L38 32 L28 40" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Underscore cursor _ -->
  <line x1="40" y1="40" x2="48" y2="40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>
