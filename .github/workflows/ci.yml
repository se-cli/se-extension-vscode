name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify package structure
        run: |
          echo "Checking required files..."
          for f in package.json README.md LICENSE media/se-cli.svg media/icon.png; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
            echo "  ✓ $f"
          done
          echo "All required files present."

      - name: Package VSIX (dry run)
        run: npx @vscode/vsce package --no-git-tag-version --allow-star-activation

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: se-extension-vscode-vsix
          path: "*.vsix"
          retention-days: 7
